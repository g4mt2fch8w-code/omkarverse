<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Stripes shall Remain · Tiger Tail Dynamic Curve</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: #F8F8F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Aeonik", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body.day-mode {
      background-color: #F7F6F2;
      color: #001445;
    }

    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #tailCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
    }

    #callout {
      position: absolute;
      z-index: 10;
      left: clamp(30px, 8vw, 100px);
      top: clamp(20%, 28vh, 36%);
      max-width: min(90vw, 580px);
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #callout.active {
      opacity: 1;
      transform: translateY(0);
    }

    .badge {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(0.68rem, 0.85vw, 0.85rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #FFB800;
      background: rgba(255, 184, 0, 0.12);
      border: 1px solid rgba(255, 184, 0, 0.35);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .headline {
      font-size: clamp(2.6rem, 5.2vw, 5.4rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF5D0 30%, #FFB800 65%, #E5A93C 90%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 28px rgba(255, 184, 0, 0.55)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.95));
      margin-bottom: 12px;
    }

    body.day-mode .headline {
      background: linear-gradient(135deg, #92400E 0%, #B45309 30%, #D97706 60%, #FFB800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(217, 119, 6, 0.35));
    }

    .meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(0.7rem, 0.85vw, 0.85rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
    }
    body.day-mode .meta {
      color: rgba(0, 20, 69, 0.7);
    }

    /* Controls bar at bottom */
    #controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 14, 26, 0.85);
      border: 1px solid rgba(255, 184, 0, 0.25);
      border-radius: 999px;
      padding: 8px 18px;
      backdrop-filter: blur(12px);
    }
    body.day-mode #controls {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(217, 119, 6, 0.3);
    }

    .btn {
      background: rgba(255, 184, 0, 0.15);
      border: 1px solid rgba(255, 184, 0, 0.4);
      color: #FFB800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #FFB800;
      color: #050811;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="tailCanvas"></canvas>

    <div id="callout">
      <div class="badge">CENTRAL INDIA & EASTERN VIDARBHA</div>
      <h1 class="headline">The Stripes shall Remain</h1>
      <p class="meta">APEX SOVEREIGNTY · RESILIENT CALL · T-106</p>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="replayBtn">↻ REPLAY</button>
    <button class="btn" id="themeBtn">◐ THEME</button>
  </div>

  <script>
  (function() {
    const canvas = document.getElementById('tailCanvas');
    const ctx = canvas.getContext('2d');
    const callout = document.getElementById('callout');
    const replayBtn = document.getElementById('replayBtn');
    const themeBtn = document.getElementById('themeBtn');

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Spline Definition inspired by the Tiger Anthem animation:
    // Starts lower-left, arches up gracefully, sweeps down and to the right,
    // then swoops up into a magnificent loop/curl.
    function getSplineControlPoints() {
      const cx = width * 0.5;
      const cy = height * 0.5;
      const scale = Math.min(width / 1100, height / 800, 1.2);

      return [
        { x: cx - 420 * scale, y: cy + 320 * scale }, // Base / origin
        { x: cx - 440 * scale, y: cy + 120 * scale }, // Rising vertically
        { x: cx - 340 * scale, y: cy - 140 * scale }, // Peak arch (crest)
        { x: cx - 140 * scale, y: cy - 080 * scale }, // Swoop descending
        { x: cx + 060 * scale, y: cy + 160 * scale }, // Bottom dip
        { x: cx + 280 * scale, y: cy + 120 * scale }, // Sweeping right
        { x: cx + 420 * scale, y: cy - 040 * scale }, // Curling upward
        { x: cx + 380 * scale, y: cy - 200 * scale }, // Arching loop peak
        { x: cx + 220 * scale, y: cy - 180 * scale }, // Inward curl
        { x: cx + 180 * scale, y: cy - 070 * scale }, // Inner loop curl
        { x: cx + 260 * scale, y: cy + 010 * scale }  // Curl tail finish
      ];
    }

    // Catmull-Rom spline sampling
    function getSplinePoint(points, t) {
      const pCount = points.length;
      const clampedT = Math.max(0, Math.min(1, t));
      const totalSegs = pCount - 1;
      const segFloat = clampedT * totalSegs;
      const segIndex = Math.min(Math.floor(segFloat), totalSegs - 1);
      const localT = segFloat - segIndex;

      const p0 = points[Math.max(0, segIndex - 1)];
      const p1 = points[segIndex];
      const p2 = points[Math.min(pCount - 1, segIndex + 1)];
      const p3 = points[Math.min(pCount - 1, segIndex + 2)];

      const t2 = localT * localT;
      const t3 = t2 * localT;

      const x = 0.5 * (
        (2 * p1.x) +
        (-p0.x + p2.x) * localT +
        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
      );

      const y = 0.5 * (
        (2 * p1.y) +
        (-p0.y + p2.y) * localT +
        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
      );

      return { x, y };
    }

    // Dense path generation for smooth rendering and accurate normal calculation
    const NUM_SAMPLES = 450;
    function computeSampledPath(points) {
      const samples = [];
      let totalLength = 0;
      let prevPt = null;

      for (let i = 0; i <= NUM_SAMPLES; i++) {
        const t = i / NUM_SAMPLES;
        const pt = getSplinePoint(points, t);
        if (prevPt) {
          const dist = Math.hypot(pt.x - prevPt.x, pt.y - prevPt.y);
          totalLength += dist;
        }
        samples.push({
          x: pt.x,
          y: pt.y,
          t: t,
          dist: totalLength
        });
        prevPt = pt;
      }

      // Compute normals and tangents
      for (let i = 0; i <= NUM_SAMPLES; i++) {
        const next = samples[Math.min(NUM_SAMPLES, i + 1)];
        const prev = samples[Math.max(0, i - 1)];
        let dx = next.x - prev.x;
        let dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len;
        dy /= len;

        samples[i].tangent = { x: dx, y: dy };
        samples[i].normal = { x: -dy, y: dx }; // 90 deg counterclockwise
      }

      return { samples, totalLength };
    }

    let progress = 0;
    let targetProgress = 1;
    let animSpeed = 0.006;
    let isReplaying = false;

    // Tail width profile (taper from thick base to sleek tip)
    function getRadius(t) {
      // starts around 30px, swells to 32px, tapers to 20px near tip
      return 30 - 12 * Math.pow(t, 1.4);
    }

    function renderTail(curProgress, idleTime) {
      const points = getSplineControlPoints();
      const { samples, totalLength } = computeSampledPath(points);
      const curDist = curProgress * totalLength;

      // Find active sample index
      let activeIndex = 0;
      for (let i = 0; i < samples.length; i++) {
        if (samples[i].dist <= curDist) {
          activeIndex = i;
        } else {
          break;
        }
      }
      if (activeIndex < 2) return;

      ctx.clearRect(0, 0, width, height);

      // 1. AURA GLOW UNDERLAY
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(samples[0].x, samples[0].y);
      for (let i = 1; i <= activeIndex; i++) {
        ctx.lineTo(samples[i].x, samples[i].y);
      }
      ctx.lineWidth = getRadius(0) * 2.8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255, 184, 0, 0.25)';
      ctx.shadowColor = '#FFB800';
      ctx.shadowBlur = 45;
      ctx.stroke();
      ctx.restore();

      // 2. MAIN FUR RIBBON (Golden-Amber gradient along normals)
      // We construct a quad-strip along the curve
      ctx.save();
      for (let i = 0; i < activeIndex; i++) {
        const s0 = samples[i];
        const s1 = samples[i + 1];
        const r0 = getRadius(s0.t);
        const r1 = getRadius(s1.t);

        const left0 = { x: s0.x + s0.normal.x * r0, y: s0.y + s0.normal.y * r0 };
        const right0 = { x: s0.x - s0.normal.x * r0, y: s0.y - s0.normal.y * r0 };
        const left1 = { x: s1.x + s1.normal.x * r1, y: s1.y + s1.normal.y * r1 };
        const right1 = { x: s1.x - s1.normal.x * r1, y: s1.y - s1.normal.y * r1 };

        // Fur color gradient across cylinder
        const grad = ctx.createLinearGradient(left0.x, left0.y, right0.x, right0.y);
        grad.addColorStop(0.0, '#9A3412');  // Deep shadow edge
        grad.addColorStop(0.18, '#EA580C'); // Vibrant orange
        grad.addColorStop(0.50, '#FFB800'); // Radiant golden spine
        grad.addColorStop(0.85, '#FFD54F'); // Soft amber light
        grad.addColorStop(1.0, '#FFFBEB');  // White belly fur highlight

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(left0.x, left0.y);
        ctx.lineTo(left1.x, left1.y);
        ctx.lineTo(right1.x, right1.y);
        ctx.lineTo(right0.x, right0.y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // 3. AUTHENTIC TIGER STRIPES
      // Draw dark curved bands across the tail at periodic distances
      const stripeSpacing = 36;
      ctx.save();
      for (let d = 30; d < curDist - 25; d += stripeSpacing) {
        // Find sample at distance d
        let sIdx = 0;
        for (let i = 0; i < samples.length - 1; i++) {
          if (samples[i].dist <= d && samples[i + 1].dist >= d) {
            sIdx = i;
            break;
          }
        }
        const s = samples[sIdx];
        if (!s) continue;

        const r = getRadius(s.t);
        const stripeWidth = 14 + 6 * Math.sin(d * 0.1); // organic variation

        // Curved stripe shape across the tail
        const pLeft = { x: s.x + s.normal.x * (r + 1), y: s.y + s.normal.y * (r + 1) };
        const pMid = { x: s.x + s.tangent.x * 6, y: s.y + s.tangent.y * 6 };
        const pRight = { x: s.x - s.normal.x * (r + 1), y: s.y - s.normal.y * (r + 1) };

        ctx.strokeStyle = '#0C0A09';
        ctx.lineWidth = stripeWidth;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.quadraticCurveTo(pMid.x, pMid.y, pRight.x, pRight.y);
        ctx.stroke();

        // Subtle dark fur texture accents on the stripe ends
        ctx.fillStyle = 'rgba(12, 10, 9, 0.4)';
        ctx.beginPath();
        ctx.arc(pLeft.x, pLeft.y, stripeWidth * 0.4, 0, Math.PI * 2);
        ctx.arc(pRight.x, pRight.y, stripeWidth * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 4. LEADING BLACK TIP (The hallmark of the Bengal Tiger)
      // Positioned at the very front of the drawn curve
      const head = samples[activeIndex];
      const headRadius = getRadius(head.t);

      ctx.save();
      ctx.translate(head.x, head.y);
      const angle = Math.atan2(head.tangent.y, head.tangent.x);
      ctx.rotate(angle);

      // Black tip hemisphere and tuft
      ctx.fillStyle = '#08080A';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      // Rounded tip dome
      ctx.arc(0, 0, headRadius, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(headRadius * 0.6, 0);
      ctx.closePath();
      ctx.fill();

      // Pure white fur tuft highlight at the absolute tip
      ctx.fillStyle = '#FFFDF5';
      ctx.shadowColor = '#FFB800';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(headRadius * 0.75, 0, headRadius * 0.28, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    let lastTime = performance.now();
    let idleTimer = 0;

    function animate(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (progress < targetProgress) {
        progress += animSpeed;
        if (progress >= targetProgress) {
          progress = targetProgress;
          callout.classList.add('active');
        }
      } else {
        idleTimer += dt;
      }

      renderTail(progress, idleTimer);

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    replayBtn.addEventListener('click', () => {
      progress = 0;
      callout.classList.remove('active');
    });

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('day-mode');
    });
  })();
  </script>
</body>
</html>
