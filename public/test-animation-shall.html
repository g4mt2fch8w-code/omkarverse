<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Stripes shall Remain · Tiger Tail Film Animation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F7F6F2; /* Default British Soft White */
      color: #001445;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Aeonik", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    body.night-mode {
      background-color: #050811;
      color: #F8F8F8;
    }

    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* THE TITLE */
    #title-container {
      text-align: center;
      margin-bottom: 24px;
      z-index: 10;
    }

    .headline {
      font-size: clamp(2.4rem, 5vw, 4.8rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #78350F 0%, #B45309 30%, #D97706 65%, #FFB800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(217, 119, 6, 0.3));
      margin: 0 0 10px 0;
    }
    body.night-mode .headline {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF5D0 30%, #FFB800 65%, #E5A93C 90%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 28px rgba(255, 184, 0, 0.55)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.95));
    }

    /* CINEMA VIEWER */
    .cinema-box {
      position: relative;
      width: 100%;
      max-width: min(92vw, 920px);
      border-radius: 24px;
      background: #FFFFFF;
      border: 1px solid rgba(217, 119, 6, 0.3);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08), 0 0 50px rgba(255, 184, 0, 0.15);
      padding: 12px;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    body.night-mode .cinema-box {
      background: #0B0F1C;
      border-color: rgba(255, 184, 0, 0.35);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 184, 0, 0.25);
    }

    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 16px;
      overflow: hidden;
      background: #F7F6F2;
    }
    body.night-mode .video-viewport {
      background: #000000;
    }

    #tigerVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
      cursor: pointer;
    }

    /* FOCUS / ZOOM MODE (Crops out TV borders to focus 100% on the curve) */
    .cinema-box.focus-mode #tigerVideo {
      object-fit: cover;
      transform: scale(1.22) translateY(-2%);
    }

    /* MILESTONE PILLS (1973 · 2023 · 2073) */
    .milestones-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 14px;
    }
    .year-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 800;
      font-size: clamp(0.85rem, 1.1vw, 1.15rem);
      letter-spacing: 0.1em;
      padding: 6px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #FFE066 0%, #FFB800 100%);
      color: #0F0E0C;
      border: 1.5px solid #FFFDF0;
      box-shadow: 0 2px 10px rgba(255, 184, 0, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .year-pill:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 4px 16px rgba(255, 184, 0, 0.6);
    }

    /* CONTROLS BAR */
    #controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: 999px;
      padding: 8px 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    body.night-mode #controls {
      background: rgba(10, 14, 26, 0.88);
      border-color: rgba(255, 184, 0, 0.3);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    .btn {
      background: rgba(217, 119, 6, 0.12);
      border: 1px solid rgba(217, 119, 6, 0.4);
      color: #B45309;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    .btn:hover, .btn.active {
      background: #D97706;
      color: #FFF;
    }
    body.night-mode .btn {
      background: rgba(255, 184, 0, 0.15);
      border-color: rgba(255, 184, 0, 0.4);
      color: #FFB800;
    }
    body.night-mode .btn:hover, body.night-mode .btn.active {
      background: #FFB800;
      color: #050811;
      box-shadow: 0 0 15px rgba(255, 184, 0, 0.5);
    }

    #timeDisplay {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 65px;
      text-align: center;
    }
  </style>
</head>
<body class="day-mode">
  <div id="stage">
    <div id="title-container">
      <h1 class="headline">The Stripes shall Remain</h1>
    </div>

    <!-- Cinema Box -->
    <div class="cinema-box focus-mode" id="cinemaBox">
      <div class="video-viewport">
        <video
          id="tigerVideo"
          src="/assets/tiger-anthem/anthem.mp4#t=192"
          playsinline
          autoplay
          muted
          loop
          preload="auto"
        ></video>
      </div>

      <!-- 1973 · 2023 · 2073 Milestones -->
      <div class="milestones-bar">
        <span class="year-pill" id="pill1973" onclick="seekTo(192)">1973</span>
        <span class="year-pill" id="pill2023" onclick="seekTo(194.5)">2023</span>
        <span class="year-pill" id="pill2073" onclick="seekTo(196)">2073</span>
      </div>
    </div>
  </div>

  <!-- Interactive Controls Bar -->
  <div id="controls">
    <button class="btn active" id="loopAnimationBtn">⚡ LOOP TIGER TAIL (3:12 - 3:20)</button>
    <button class="btn" id="playFullBtn">▶ PLAY FULL ANTHEM</button>
    <button class="btn" id="focusBtn">🔍 CROP: ON</button>
    <button class="btn" id="soundBtn">🔇 SOUND: OFF</button>
    <span id="timeDisplay">3:14</span>
    <button class="btn" id="themeBtn">◐ NIGHT / DAY</button>
  </div>

  <script>
  (function() {
    const video = document.getElementById('tigerVideo');
    const cinemaBox = document.getElementById('cinemaBox');
    const loopBtn = document.getElementById('loopAnimationBtn');
    const playFullBtn = document.getElementById('playFullBtn');
    const focusBtn = document.getElementById('focusBtn');
    const soundBtn = document.getElementById('soundBtn');
    const themeBtn = document.getElementById('themeBtn');
    const timeDisplay = document.getElementById('timeDisplay');

    // Tail animation is from 192.5s (3:12.5) to 201s (3:21)
    const LOOP_START = 192.5;
    const LOOP_END = 200.5;
    let isLoopingAnimation = true;

    function initVideo() {
      video.currentTime = LOOP_START;
      video.play().catch(e => console.log('Autoplay prevented, user click needed', e));
    }

    video.addEventListener('timeupdate', () => {
      const cur = video.currentTime;
      const mins = Math.floor(cur / 60);
      const secs = Math.floor(cur % 60).toString().padStart(2, '0');
      timeDisplay.textContent = mins + ':' + secs;

      if (isLoopingAnimation) {
        if (cur >= LOOP_END || cur < LOOP_START - 1) {
          video.currentTime = LOOP_START;
          video.play();
        }
      }
    });

    window.seekTo = function(seconds) {
      isLoopingAnimation = false;
      loopBtn.classList.remove('active');
      playFullBtn.classList.add('active');
      video.currentTime = seconds;
      video.play();
    };

    loopBtn.addEventListener('click', () => {
      isLoopingAnimation = true;
      loopBtn.classList.add('active');
      playFullBtn.classList.remove('active');
      video.currentTime = LOOP_START;
      video.play();
    });

    playFullBtn.addEventListener('click', () => {
      isLoopingAnimation = false;
      playFullBtn.classList.add('active');
      loopBtn.classList.remove('active');
      video.currentTime = 0;
      video.play();
    });

    focusBtn.addEventListener('click', () => {
      cinemaBox.classList.toggle('focus-mode');
      focusBtn.textContent = cinemaBox.classList.contains('focus-mode') ? '🔍 CROP: ON' : '🔍 CROP: OFF';
    });

    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      soundBtn.textContent = video.muted ? '🔇 SOUND: OFF' : '🔊 SOUND: ON';
      if (!video.muted) {
        soundBtn.classList.add('active');
      } else {
        soundBtn.classList.remove('active');
      }
    });

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('night-mode');
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initVideo);
    } else {
      initVideo();
    }
  })();
  </script>
</body>
</html>
